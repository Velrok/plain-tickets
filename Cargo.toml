[package]
name = "plain-tickets"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "tickets"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
nanoid = "0.4"
petgraph = "0.6"
toml = "0.8"
anyhow = "1.0.102"
# `unstable-rendered-line-info` exposes `Paragraph::line_count`, the only
# exact measure of how many rows a wrapped paragraph occupies. `draw_detail`
# needs it to truncate against rendered rows rather than source lines.
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = "0.28"
notify = "6"
arboard = "3"
unicode-width = "0.2"
anstream = "1"
anstyle = "1"

[dev-dependencies]
toml = "0.8"
insta = "1"
